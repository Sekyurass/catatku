<!doctype html>
<html lang="id" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Terjemahan otomatis browser mengubah DOM di luar React dan membuat aplikasi crash (layar putih). -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <title>Catatku — Catat Keuangan Pribadi dalam Hitungan Detik</title>
    <meta
      name="description"
      content="Aplikasi catatan keuangan pribadi gratis: catat pemasukan dan pengeluaran, pindai struk, atur anggaran, dan pantau utang-piutang dalam Rupiah."
    />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="etXCvusA4Gyw14uTmhH5iv4Qu3jzt9T64-hGy0IeZQY" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Catatku" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Catatku — Catat Keuangan Pribadi dalam Hitungan Detik" />
    <meta
      property="og:description"
      content="Catat pemasukan dan pengeluaran, pindai struk, atur anggaran, dan pantau utang-piutang. Gratis."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catatku — aplikasi catatan keuangan pribadi" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tema diterapkan sebelum aplikasi dimuat agar tidak berkedip putih. Lihat src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('catatku_theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        if (t === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F172A');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
