# Opsional: PostgreSQL lokal sebagai alternatif Supabase.
# Redis (Fase 1) dan MinIO (Fase 2) ditambahkan saat fasenya dimulai.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catatku
      POSTGRES_PASSWORD: catatku
      POSTGRES_DB: catatku
    ports:
      - '5433:5432'
    volumes:
      - catatku-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catatku']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catatku-db:
